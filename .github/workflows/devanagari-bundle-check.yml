name: Devanagari Bundle Check

on:
  push:
    paths:
      - "packages/i18n/**"
      - "scripts/check-devanagari-bundle.mjs"
  pull_request:
    paths:
      - "packages/i18n/**"
      - "scripts/check-devanagari-bundle.mjs"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.11.0"
      - run: node scripts/check-devanagari-bundle.mjs
