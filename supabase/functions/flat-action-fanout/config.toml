# flat-action-fanout is invoked by a Postgres trigger (notify_push_on_flat_action)
# via pg_net — NOT by an end-user JWT, so verify_jwt = false (same as the other
# push fan-out functions). Access control is the function's own authorize():
# a constant-time match of the `x-webhook-secret` header against env
# FANOUT_WEBHOOK_SECRET (fails closed when unset), or a service-role Bearer.
[functions.flat-action-fanout]
verify_jwt = false
